name: Auto Update SIF AUM Data

on:
  schedule:
    - cron: '0 18 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  update-aum-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run SIF AUM Pipeline
        run: |
          python scripts/update_sif_aum.py
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          git add data/sif/scheme/nav/daily/
          
          if git diff --cached --quiet; then
            echo "No new AUM updates."
          else
            git commit -m "Auto update SIF AUM data"
            git push
            echo "Successfully updated and pushed new SIF AUM data."
          fi
