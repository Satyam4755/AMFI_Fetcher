name: Backfill Historical SIF NAV

on:
  workflow_dispatch:
    inputs:
      sif_code:
        description: 'Optional SIF code to backfill (e.g. SIF-13). Leave blank for all.'
        required: false
        default: ''
        type: string
      from_date:
        description: 'Optional start date for recovery (YYYY-MM-DD or dd-MMM-yyyy)'
        required: false
        default: ''
        type: string
      to_date:
        description: 'Optional end date for recovery (YYYY-MM-DD or dd-MMM-yyyy)'
        required: false
        default: ''
        type: string
      recalculate_performance:
        description: 'Recalculate performance JSONs after historical backfill'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  backfill-historical-nav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Historical NAV Backfill
        run: |
          CMD="python scripts/backfill_historical_nav.py"
          if [ -n "${{ inputs.sif_code }}" ]; then
            CMD="$CMD --sif-code ${{ inputs.sif_code }}"
          fi
          if [ -n "${{ inputs.from_date }}" ]; then
            CMD="$CMD --from-date ${{ inputs.from_date }}"
          fi
          if [ -n "${{ inputs.to_date }}" ]; then
            CMD="$CMD --to-date ${{ inputs.to_date }}"
          fi
          if [ "${{ inputs.recalculate_performance }}" != "true" ]; then
            CMD="$CMD --no-performance"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Run Validation & Tests
        run: |
          python -m unittest discover -s tests

      - name: Commit and Push Recovered Data
        id: commit_step
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/sif/scheme/nav/
          git add data/sif/scheme/performance/

          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No historical NAV or performance changes to commit."
          else
            TARGET="${{ inputs.sif_code }}"
            if [ -n "$TARGET" ]; then
              MSG="Recover historical SIF NAV & performance for $TARGET"
            else
              MSG="Recover historical SIF NAV & performance data"
            fi
            git commit -m "$MSG"
            git push origin ${{ github.ref_name }}
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "Successfully committed and pushed $COMMIT_SHA"
          fi

      - name: Report Backfill Results Summary
        run: |
          echo "### Historical NAV Backfill Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **SIF Code Target:** ${{ inputs.sif_code || 'All Active Non-Direct SIFs' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **From Date:** ${{ inputs.from_date || 'Inception/Earliest Available' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **To Date:** ${{ inputs.to_date || 'Current Date' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Recalculate Performance:** ${{ inputs.recalculate_performance }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.commit_step.outputs.has_changes }}" = "true" ]; then
            echo "- **Status:** ✅ Recovered data committed and pushed successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit SHA:** \`${{ steps.commit_step.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ℹ️ No changes needed (repository already up to date)" >> $GITHUB_STEP_SUMMARY
          fi
